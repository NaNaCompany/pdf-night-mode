<header><span class="badge">PDF</span></header><section class="heading"><h1>PDF颜色反转</h1></section>
<div class="workspace"><section class="panel controls" aria-label="PDF颜色反转"><div class="section-label"><span>01</span><h2>选择PDF</h2></div>
<label class="dropzone" id="dropzone" for="file"><span class="upload-icon" aria-hidden="true">↑</span><strong>选择PDF</strong><span>或拖放到此处 · 最大80 MB</span><input id="file" type="file" accept=".pdf,application/pdf"></label><p id="fileInfo" class="hint">选择文件以预览第一页。</p>
<details><summary>加密PDF</summary><label for="password">文档密码</label><input type="password" id="password" autocomplete="off"><button id="retry" type="button">使用此密码打开</button></details>
<div class="section-label second"><span>02</span><h2>颜色</h2></div><div class="themes" role="group" aria-label="颜色"><button class="theme selected" data-theme="black" style="--paper:#000;--ink:#fff" aria-pressed="true"><i>Aa</i>黑色</button><button class="theme" data-theme="gray" style="--paper:#2b2d31;--ink:#ededeb" aria-pressed="false"><i>Aa</i>灰色</button><button class="theme" data-theme="blue" style="--paper:#142238;--ink:#e8edf4" aria-pressed="false"><i>Aa</i>深蓝色</button><button class="theme" data-theme="sepia" style="--paper:#30251e;--ink:#f5e6ce" aria-pressed="false"><i>Aa</i>棕褐色</button></div>
<div class="two"><div><label for="bg">背景颜色</label><input type="color" id="bg" value="#000000"></div><div><label for="fg">文字颜色</label><input type="color" id="fg" value="#ffffff"></div></div>
<label for="range">保存页面</label><input id="range" type="text" placeholder="全部 · 例如：1-3, 8" aria-describedby="rangeHint"><p class="hint" id="rangeHint">留空表示全部。每次最多100页。</p>
<label for="dpi">输出分辨率</label><select id="dpi"><option value="96">小文件 · 96 DPI</option><option value="144" selected>标准 · 144 DPI</option><option value="216">高清 · 216 DPI</option></select><p class="hint">超大页面会降低分辨率以限制内存使用。</p>
