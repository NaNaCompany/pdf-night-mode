<!doctype html><html lang="{{lang}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>{{title}}</title><meta name="description" content="{{disclosure}}">{{metadata}}<link rel="stylesheet" href="{{base}}style.css?v={{version}}"><script id="translations" type="application/json">{{translations}}</script><script type="module" src="{{base}}app.js?v={{version}}"></script></head><body class="pdf"><main>
<header><span class="badge">PDF</span></header><section class="heading"><h1>{{title}}</h1></section>
<div class="workspace"><section class="panel controls" aria-label="{{title}}"><div class="section-label"><span>01</span><h2>{{upload}}</h2></div>
<label class="dropzone" id="dropzone" for="file"><span class="upload-icon" aria-hidden="true">↑</span><strong>{{upload}}</strong><span>{{drop}}</span><input id="file" type="file" accept=".pdf,application/pdf"></label><p id="fileInfo" class="hint">{{fileHint}}</p>
<details><summary>{{password}}</summary><label for="password">{{passwordLabel}}</label><input type="password" id="password" autocomplete="off"><button id="retry" type="button">{{retry}}</button></details>
<div class="section-label second"><span>02</span><h2>{{colors}}</h2></div><div class="themes" role="group" aria-label="{{colors}}"><button class="theme selected" data-theme="black" style="--paper:#000;--ink:#fff" aria-pressed="true"><i>Aa</i>{{black}}</button><button class="theme" data-theme="gray" style="--paper:#2b2d31;--ink:#ededeb" aria-pressed="false"><i>Aa</i>{{gray}}</button><button class="theme" data-theme="blue" style="--paper:#142238;--ink:#e8edf4" aria-pressed="false"><i>Aa</i>{{blue}}</button><button class="theme" data-theme="sepia" style="--paper:#30251e;--ink:#f5e6ce" aria-pressed="false"><i>Aa</i>{{sepia}}</button></div>
<div class="two"><div><label for="bg">{{bg}}</label><input type="color" id="bg" value="#000000"></div><div><label for="fg">{{fg}}</label><input type="color" id="fg" value="#ffffff"></div></div>
<label for="range">{{range}}</label><input id="range" type="text" placeholder="{{rangePlaceholder}}" aria-describedby="rangeHint"><p class="hint" id="rangeHint">{{rangeHint}}</p>
<label for="dpi">{{dpi}}</label><select id="dpi"><option value="96">{{low}}</option><option value="144" selected>{{medium}}</option><option value="216">{{high}}</option></select><p class="hint">{{resolutionHint}}</p>
<button class="primary" id="convert" disabled>{{convert}} <span aria-hidden="true">↓</span></button><button id="cancel" class="cancel" hidden>{{cancel}}</button><progress id="progress" value="0" max="1" hidden aria-label="{{convert}}"></progress><p id="status" class="status" role="status" aria-live="polite">{{initial}}</p>
</section><section class="preview-panel" aria-label="{{preview}}"><div class="preview-top"><h2>{{preview}}</h2><div class="pager"><button id="prev" disabled aria-label="{{previous}}">←</button><span id="pageLabel">— / —</span><button id="next" disabled aria-label="{{next}}">→</button></div></div><div class="pdf-preview empty" id="preview"><span id="empty">{{empty}}</span><div id="canvases" hidden><figure><figcaption>{{original}}</figcaption><canvas id="original"></canvas></figure><figure><figcaption>{{processed}}</figcaption><canvas id="processed"></canvas></figure></div></div><div class="note"><p>{{disclosure}}</p><p>{{limits}}</p><a href="licenses.html">{{licenses}} ↗</a></div></section></div>
<footer><span>{{privacy}}</span><label class="language">{{language}} <select id="language">{{languageOptions}}</select></label><a class="more" href="https://nanalab.kr/apps/">More Apps</a></footer></main></body></html>
